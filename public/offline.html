<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090B0A" />
    <title>Offline — Ping by DOT</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #090b0a;
        --card: #121715;
        --border: rgba(255, 255, 255, 0.12);
        --fg: #f4f7f5;
        --muted: #9aa7a0;
        --lime: #c7f36b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      main {
        max-width: 420px;
        width: 100%;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 32px 24px;
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.4rem;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.5;
      }
      button {
        appearance: none;
        border: none;
        border-radius: 999px;
        background: var(--lime);
        color: #090b0a;
        font-weight: 700;
        font-size: 0.92rem;
        padding: 12px 24px;
        cursor: pointer;
      }
      button:active {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Ping by DOT" />
      <h1>You are currently offline</h1>
      <p>
        Ping cannot reach the network right now. Any queued drafts or offline actions will sync
        automatically once your connection returns.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
